name: Vercel Auto Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  trigger-owner-deploy:
    runs-on: ubuntu-latest
    # Só executa quando o autor não for o dono da conta Vercel (Jean)
    # e a mensagem não contiver [auto-deploy], prevenindo loops infinitos.
    if: "!contains(github.event.head_commit.author.email, 'jean.pinhata@gmail.com') && !contains(github.event.head_commit.message, '[auto-deploy]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trigger deploy via Hook or Owner Commit
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Disparando Vercel Deploy Hook..."
            curl -s -X POST "$DEPLOY_HOOK"
            echo "Deploy solicitado com sucesso via hook."
          else
            echo "Disparando deploy via commit assinado pelo dono da conta Vercel..."
            git config user.name "Jean Pinhata"
            git config user.email "jean.pinhata@gmail.com"
            git commit --allow-empty -m "chore(deploy): sincronizar atualizacoes para deploy na Vercel [auto-deploy]"
            git push origin main
            echo "Commit de sincronizacao enviado com sucesso."
          fi
